<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Fakezalem | Wilton Lucas</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* LOADING */
#loading {
    position: fixed;
    width: 100%;
    height: 100%;
    z-index: 999;
}

/* BACKGROUND */
.bg {
    position: absolute;
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center;
    filter: blur(2px) brightness(0.3);
}

/* OVERLAY */
.overlay {
    position: absolute;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.55);
}

/* ESFERA */
.brain-ball{
    position:absolute;
    left:50%;
    top:45%;

    width:280px;
    height:280px;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:
    radial-gradient(
        circle at center,
        rgba(255,180,240,.95),
        rgba(255,60,170,.85),
        rgba(100,0,60,.8)
    );

    box-shadow:
        0 0 40px #ff5edb,
        0 0 100px #ff5edb,
        0 0 180px rgba(255,0,180,.4);

    animation:pulseBall 2s infinite;
}

@keyframes pulseBall{
    0%{
        transform:translate(-50%,-50%) scale(1);
    }
    50%{
        transform:translate(-50%,-50%) scale(1.05);
    }
    100%{
        transform:translate(-50%,-50%) scale(1);
    }
}

/* NÚCLEO */
.core{
    position:absolute;

    width:18px;
    height:18px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:white;

    box-shadow:
        0 0 20px white,
        0 0 60px #9ca8ff;
}

/* NEURÔNIOS */
.node{
    position:absolute;
    width:10px;
    height:10px;

    border-radius:50%;
    background:#ffd8ff;

    animation:flash 1.3s infinite;
}

@keyframes flash{
    50%{
        box-shadow:
            0 0 12px white,
            0 0 25px #ff7ce8;
    }
}

.n1{top:18%;left:35%;}
.n2{top:25%;left:70%;}
.n3{top:40%;left:15%;}
.n4{top:70%;left:25%;}
.n5{top:80%;left:60%;}
.n6{top:55%;left:80%;}
.n7{top:15%;left:55%;}
.n8{top:75%;left:75%;}

/* RAIOS */
.lightning{
    position:absolute;
    width:100%;
    height:100%;
}

.lightning line{
    stroke:#d5dcff;
    stroke-width:2;
    animation:electric .15s infinite;
}

@keyframes electric{
    50%{
        opacity:.2;
    }
}

/* TEXTO */
.loading-text{
    position:absolute;
    bottom:80px;
    width:100%;

    text-align:center;

    color:#f8b4ff;

    font-size:20px;

    letter-spacing:3px;

    text-shadow:0 0 15px #ff73dd;
}

/* CONTEÚDO */
#content {
    display: none;
    color: #f8b4ff;
    background:
        linear-gradient(
            rgba(15,10,25,.65),
            rgba(5,5,15,.85)
        ),
        url("https://wallpapercave.com/wp/wp5128415.jpg");

    background-size: cover;
    background-position: center;
    height: 100vh;
    overflow-y: auto;

    display:flex;
    justify-content:center;
    align-items:center;
}


.box{
.profile-card{
    position:absolute;
    top:20px;
    left:20px;

    width:320px;
    padding:15px;

    display:flex;
    gap:15px;
    align-items:center;

    border-radius:25px;

    backdrop-filter: blur(15px);

    background:rgba(30,20,50,.35);

    border:1px solid rgba(255,255,255,.15);

    box-shadow:0 0 20px rgba(248,180,255,.25);
}

.profile-card img{
    width:90px;
    height:90px;
    border-radius:50%;
    object-fit:cover;
}

.profile-name{
    font-size:32px;
    font-weight:bold;
}

.profile-sub{
    color:#d8c7ff;
}

.main-panel{
    width:700px;
    margin:180px auto 50px auto;

    padding:25px;

    border-radius:25px;

    backdrop-filter: blur(15px);

    background:rgba(15,15,20,.45);

    border:1px solid rgba(255,255,255,.12);
}

.section{
    margin-top:15px;
}

.section button{
    width:100%;
    padding:15px;

    border:none;

    border-radius:12px;

    color:white;

    background:
        linear-gradient(
            90deg,
            #a40052,
            #ff0080
        );

    cursor:pointer;

    font-size:16px;
}

.section-content{
    display:none;

    padding:15px;

    margin-top:8px;

    border-radius:12px;

    background:rgba(0,0,0,.3);
}
}

.box h1{
    margin-top:0;
}
</style>
</head>

<body>

<div id="loading">

    <div class="bg" id="bg1"></div>

    <div class="overlay"></div>

    <div class="brain-ball">

        <div class="core"></div>

        <div class="node n1"></div>
        <div class="node n2"></div>
        <div class="node n3"></div>
        <div class="node n4"></div>
        <div class="node n5"></div>
        <div class="node n6"></div>
        <div class="node n7"></div>
        <div class="node n8"></div>

        <svg class="lightning">

            <line x1="50%" y1="50%" x2="35%" y2="18%"/>
            <line x1="50%" y1="50%" x2="70%" y2="25%"/>
            <line x1="50%" y1="50%" x2="15%" y2="40%"/>
            <line x1="50%" y1="50%" x2="25%" y2="70%"/>
            <line x1="50%" y1="50%" x2="60%" y2="80%"/>
            <line x1="50%" y1="50%" x2="80%" y2="55%"/>
            <line x1="50%" y1="50%" x2="55%" y2="15%"/>
            <line x1="50%" y1="50%" x2="75%" y2="75%"/>

        </svg>

    </div>

    <div class="loading-text">
        ACTIVATING NEURAL NETWORK...
    </div>

</div>

<div id="content">

    <div class="profile-card">

        <img src="https://i.imgur.com/UvYj3eH.png">

        <div>
            <div class="profile-name">
                Fakezalem
            </div>

            <div class="profile-sub">
                Wilton Lucas
            </div>

            <div>
                💻 Dev • 🎮 Minecraft Modder
            </div>
        </div>

    </div>

    <div class="main-panel">

        <h1>About Me</h1>

        <div class="section">
            <button onclick="toggle('sobre')">
                Quem Sou Eu
            </button>

            <div id="sobre" class="section-content">
                Desenvolvedor apaixonado por Minecraft,
                mods, Godot e programação.
            </div>
        </div>

        <div class="section">
            <button onclick="toggle('projetos')">
                Projetos
            </button>

            <div id="projetos" class="section-content">
                SigmasPhdGuerraMod<br>
                Clone System<br>
                Jogos em Godot
            </div>
        </div>

        <div class="section">
            <button onclick="toggle('contato')">
                Redes
            </button>

            <div id="contato" class="section-content">
                GitHub<br>
                Discord<br>
                Instagram
            </div>
        </div>

    </div>

</div>

<script>

function toggle(id){
    const el = document.getElementById(id);

    if(el.style.display === "block"){
        el.style.display = "none";
    }else{
        el.style.display = "block";
    }
}
    
function link(id){
    return `https://i.imgur.com/${id}`;
}

const imagens = [
    link("MbHhd38.jpeg"),
    link("UvYj3eH.png"),
    link("uBNCHq7.jpeg"),
    link("IWNUmTa.jpeg"),
    link("66KX5mj.jpeg"),
    link("FwVS147.jpeg"),
    link("0BkZdsK.jpeg"),
    link("QzXuK8A.jpeg")
];

const randomImage =
    imagens[Math.floor(Math.random() * imagens.length)];

document.getElementById("bg1").style.backgroundImage =
    `url(${randomImage})`;

const textos = [
    "INITIALIZING MEMORY...",
    "LOADING PROFILE...",
    "ACTIVATING NEURAL LINKS...",
    "WELCOME FAKEZALEM"
];

let indice = 0;

setInterval(() => {

    document.querySelector(".loading-text").innerText =
        textos[indice];

    indice++;

    if(indice >= textos.length){
        indice = 0;
    }

}, 800);

setTimeout(() => {

    document.getElementById("loading").style.display = "none";

    document.getElementById("content").style.display = "flex";

}, 5000);

</script>

</body>
</html>
