<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Fakezalem | Wilton Lucas</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    overflow: hidden;
}

/* LOADING */
#loading {
    position: fixed;
    width: 100%;
    height: 100%;
    z-index: 999;
}

/* BACKGROUND DINÂMICO */
.bg {
    position: absolute;
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center;
    filter: blur(2px) brightness(0.6);
    transition: opacity 1s ease;
}

/* overlay escuro */
.overlay {
    position: absolute;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.4);
}

/* TEXTO */
.loading-text {
    position: absolute;
    bottom: 50px;
    width: 100%;
    text-align: center;
    color: #f8b4ff;
    font-size: 22px;
    letter-spacing: 3px;
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    0% { opacity: 0.3; }
    50% { opacity: 1; }
    100% { opacity: 0.3; }
}

/* CONTEÚDO */
#content {
    display: none;
    color: #f8b4ff;
    background:
        linear-gradient(
            rgba(15,10,25,.65),
            rgba(5,5,15,.85)
        ),
        url("https://wallpapercave.com/wp/wp5128415.jpg");

    background-size: cover;
    background-position: center;
    height: 100vh;
    overflow-y: auto;
}

.box {
    background: rgba(0,0,0,0.7);
    padding: 30px;
    border-radius: 15px;
    display: inline-block;
    box-shadow: 0 0 30px #f8b4ff55;
    animation: fadeIn 2s ease;
    margin-top: 100px;
}

.profile-card{
    position:absolute;
    top:20px;
    left:20px;

    width:320px;
    padding:15px;

    display:flex;
    gap:15px;
    align-items:center;

    border-radius:25px;

    backdrop-filter: blur(15px);

    background:rgba(30,20,50,.35);

    border:1px solid rgba(255,255,255,.15);

    box-shadow:0 0 20px rgba(248,180,255,.25);
}

.profile-card img{
    width:90px;
    height:90px;
    border-radius:50%;
    object-fit:cover;
}

.profile-name{
    font-size:32px;
    font-weight:bold;
}

.profile-sub{
    color:#d8c7ff;
}

.main-panel{
    width:700px;
    margin:180px auto 50px auto;

    padding:25px;

    border-radius:25px;

    backdrop-filter: blur(15px);

    background:rgba(15,15,20,.45);

    border:1px solid rgba(255,255,255,.12);
}

.section{
    margin-top:15px;
}

.section button{
    width:100%;
    padding:15px;

    border:none;

    border-radius:12px;

    color:white;

    background:
        linear-gradient(
            90deg,
            #a40052,
            #ff0080
        );

    cursor:pointer;

    font-size:16px;
}

.section-content{
    display:none;

    padding:15px;

    margin-top:8px;

    border-radius:12px;

    background:rgba(0,0,0,.3);
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(30px);}
    to { opacity: 1; transform: translateY(0);}
}
</style>
</head>

<body>

<div id="loading">
    <div class="bg" id="bg1"></div>
    <div class="bg" id="bg2" style="opacity:0;"></div>
    <div class="overlay"></div>
    <div class="loading-text">LOADING...</div>
</div>

<div id="content">

    <div class="profile-card">

        <img src="https://i.imgur.com/UvYj3eH.png">

        <div>
            <div class="profile-name">
                Fakezalem
            </div>

            <div class="profile-sub">
                Wilton Lucas
            </div>

            <div>
                💻 Dev • 🎮 Minecraft Modder
            </div>
        </div>

    </div>

    <div class="main-panel">

        <h1>About Me</h1>

        <div class="section">
            <button onclick="toggle('sobre')">
                Quem Sou Eu
            </button>

            <div id="sobre" class="section-content">
                Desenvolvedor apaixonado por Minecraft,
                mods, Godot e programação.
            </div>
        </div>

        <div class="section">
            <button onclick="toggle('projetos')">
                Projetos
            </button>

            <div id="projetos" class="section-content">
                SigmasPhdGuerraMod<br>
                Clone System<br>
                Jogos em Godot
            </div>
        </div>

        <div class="section">
            <button onclick="toggle('contato')">
                Redes
            </button>

            <div id="contato" class="section-content">
                GitHub<br>
                Discord<br>
                Instagram
            </div>
        </div>

    </div>

</div>

<script>
    
function toggle(id){
    const el = document.getElementById(id);

    if(el.style.display === "block"){
        el.style.display = "none";
    }else{
        el.style.display = "block";
    }
}
    
function link(id){
    return `https://i.imgur.com/${id}`;
}

const imagens = [
    link("MbHhd38.jpeg"),
    link("UvYj3eH.png"),
    link("uBNCHq7.jpeg"),
    link("IWNUmTa.jpeg"),
    link("66KX5mj.jpeg"),
    link("FwVS147.jpeg"),
    link("0BkZdsK.jpeg"),
    link("QzXuK8A.jpeg")
];

// pega imagem aleatória (mesmo com 1 já funciona)
const randomImage = imagens[Math.floor(Math.random() * imagens.length)];

document.getElementById("bg1").style.backgroundImage = `url(${randomImage})`;

// finaliza loading
setTimeout(() => {
    document.getElementById("loading").style.display = "none";
    document.getElementById("content").style.display = "block";
}, 3000);
</script>

</body>
</html>
